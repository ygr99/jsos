<body>
  <!-- 启动封面：HTML 解析即铺壁纸，消除首屏白屏；React 挂载后淡出 -->
  <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;background:#000 url('/bg.webp') center/cover no-repeat;"></div>
  <div id="root"></div>
  <script>
    (function(){
      var splash=document.getElementById('boot-splash');
      var root=document.getElementById('root');
      if(!splash||!root)return;
      var hidden=false;
      function hide(){
        if(hidden)return;hidden=true;
        splash.style.transition='opacity .4s ease';
        splash.style.opacity='0';
        setTimeout(function(){splash.remove();},450);
      }
      if(root.firstElementChild){hide();return;}
      var obs=new MutationObserver(function(){
        if(root.firstElementChild){
          obs.disconnect();
          requestAnimationFrame(hide);
        }
      });
      obs.observe(root,{childList:true,subtree:true});
      setTimeout(hide,60000);/* 兜底：异常时 60s 后必移除 */
    })();
  </script>
</body>
