<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="dc-glow" cx="256" cy="512" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dc-coin" x1="150" y1="80" x2="370" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset=".5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 浅色主题色底座 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#FEF3C7"/>
  <!-- 底部同色光晕 -->
  <ellipse cx="256" cy="512" rx="256" ry="150" fill="url(#dc-glow)"/>

  <!-- 硬币 -->
  <circle cx="256" cy="192" r="128" fill="url(#dc-coin)"/>
  <circle cx="256" cy="192" r="128" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="10"/>
  <circle cx="256" cy="192" r="98" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="6"/>

  <!-- ¥ 符号 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 146 L256 196 L308 146"/>
    <path d="M256 196 L256 278"/>
    <path d="M208 222 L304 222"/>
    <path d="M208 254 L304 254"/>
  </g>

  <!-- 随时间递减的成本柱 -->
  <g fill="#D97706">
    <rect x="112" y="356" width="56" height="80" rx="18"/>
    <rect x="228" y="386" width="56" height="50" rx="17"/>
    <rect x="344" y="408" width="56" height="28" rx="14"/>
  </g>
</svg>
