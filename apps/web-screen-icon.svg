<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EFFF"/>
      <stop offset="1" stop-color="#DCD3FF"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2246"/>
      <stop offset="1" stop-color="#0B0E1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#base)"/>
  <ellipse cx="256" cy="456" rx="212" ry="72" fill="url(#glow)"/>

  <!-- 显示器 -->
  <rect x="86" y="86" width="340" height="254" rx="28" fill="url(#scr)" stroke="#8B7CFF" stroke-width="10"/>

  <!-- 矩阵字符雨 -->
  <g fill="#3DFF70">
    <rect x="118" y="128" width="15" height="122" rx="7.5" opacity="0.9"/>
    <rect x="151" y="182" width="15" height="130" rx="7.5" opacity="0.7"/>
    <rect x="216" y="120" width="15" height="92" rx="7.5" opacity="0.85"/>
    <rect x="281" y="158" width="15" height="152" rx="7.5" opacity="0.75"/>
    <rect x="346" y="120" width="15" height="186" rx="7.5" opacity="0.9"/>
    <rect x="379" y="212" width="15" height="100" rx="7.5" opacity="0.6"/>
  </g>
  <circle cx="125.5" cy="122" r="9" fill="#EAFFF2"/>
  <circle cx="353.5" cy="114" r="9" fill="#EAFFF2"/>

  <!-- 星点 -->
  <circle cx="192" cy="132" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="248" cy="182" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="312" cy="126" r="4" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="392" cy="158" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- 极光 -->
  <path d="M86 296 C 160 252, 236 316, 312 274 C 366 246, 408 262, 426 292 L 426 340 L 86 340 Z" fill="url(#aur)"/>

  <!-- 支架与底座 -->
  <rect x="216" y="340" width="80" height="26" rx="8" fill="#B7AEFF"/>
  <rect x="166" y="374" width="180" height="18" rx="9" fill="#8B7CFF"/>
</svg>
