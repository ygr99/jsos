<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#e8e1ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 浅色主题底座 + 底部同色光晕 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="432" rx="186" ry="56" fill="url(#glow)"/>

  <!-- 书籍 -->
  <g transform="translate(98,84)">
    <rect width="144" height="144" rx="34" fill="#f59e0b"/>
    <g fill="#fff">
      <path d="M26 44c12-7 26-7 38 0v62c-12-7-26-7-38 0z"/>
      <path d="M118 44c-12-7-26-7-38 0v62c12-7 26-7 38 0z" opacity=".78"/>
    </g>
    <path d="M72 44v62" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 影视 -->
  <g transform="translate(270,84)">
    <rect width="144" height="144" rx="34" fill="#f43f5e"/>
    <rect x="26" y="38" width="92" height="68" rx="12" fill="none" stroke="#fff" stroke-width="8"/>
    <path d="M60 56l32 21-32 21z" fill="#fff"/>
    <g fill="#fff" opacity=".9">
      <rect x="34" y="26" width="8" height="10" rx="2"/>
      <rect x="34" y="108" width="8" height="10" rx="2"/>
      <rect x="102" y="26" width="8" height="10" rx="2"/>
      <rect x="102" y="108" width="8" height="10" rx="2"/>
    </g>
  </g>

  <!-- 音乐 -->
  <g transform="translate(98,256)">
    <rect width="144" height="144" rx="34" fill="#10b981"/>
    <path d="M67 100V46l38-12v66" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="51" cy="100" r="16" fill="#fff"/>
    <circle cx="89" cy="100" r="16" fill="#fff"/>
  </g>

  <!-- 游戏 -->
  <g transform="translate(270,256)">
    <rect width="144" height="144" rx="34" fill="#7c3aed"/>
    <rect x="16" y="48" width="112" height="62" rx="30" fill="#fff"/>
    <path d="M52 68v22M41 79h22" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
    <circle cx="98" cy="70" r="7.5" fill="#7c3aed"/>
    <circle cx="114" cy="88" r="7.5" fill="#7c3aed"/>
  </g>
</svg>
