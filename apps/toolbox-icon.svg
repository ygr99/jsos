<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <!-- 底座满画布，与其他应用图标整体大小一致 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="452" rx="150" ry="26" fill="#1e40af" opacity="0.55"/>
  <!-- handle -->
  <path d="M196 160 v-18 a60 60 0 0 1 120 0 v18 h-34 v-18 a26 26 0 0 0 -52 0 v18 z" fill="url(#body)"/>
  <!-- box body -->
  <rect x="112" y="176" width="288" height="196" rx="24" fill="url(#body)"/>
  <rect x="112" y="240" width="288" height="26" fill="#93c5fd"/>
  <!-- latch -->
  <rect x="236" y="226" width="40" height="54" rx="10" fill="#1d4ed8"/>
  <circle cx="256" cy="252" r="8" fill="#dbeafe"/>
  <!-- side clasps -->
  <rect x="128" y="250" width="28" height="20" rx="6" fill="#60a5fa"/>
  <rect x="356" y="250" width="28" height="20" rx="6" fill="#60a5fa"/>
</svg>
