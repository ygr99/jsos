<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>小猪</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0F3"/>
      <stop offset="1" stop-color="#FFDCE4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 地面阴影 -->
  <ellipse cx="256" cy="424" rx="150" ry="30" fill="#F0A8BC" opacity="0.45"/>

  <!-- 身体 -->
  <ellipse cx="256" cy="312" rx="146" ry="112" fill="#FFC2D2" stroke="#D4708C" stroke-width="10"/>

  <!-- 后腿 -->
  <rect x="130" y="330" width="52" height="78" rx="26" fill="#FFB0C4" stroke="#D4708C" stroke-width="9"/>
  <rect x="330" y="330" width="52" height="78" rx="26" fill="#FFB0C4" stroke="#D4708C" stroke-width="9"/>

  <!-- 猪头 -->
  <ellipse cx="256" cy="196" rx="132" ry="106" fill="#FFD0DC" stroke="#D4708C" stroke-width="10"/>

  <!-- 耳朵：猪耳是宽而钝的三角，不是长直筒（长直筒会看成兔子） -->
  <path d="M 140 132 C 106 112 92 84 100 64 C 128 62 166 82 190 106Z"
        fill="#FFB0C4" stroke="#D4708C" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 372 132 C 406 112 420 84 412 64 C 384 62 346 82 322 106Z"
        fill="#FFB0C4" stroke="#D4708C" stroke-width="9" stroke-linejoin="round"/>

  <!-- 眼睛 -->
  <ellipse cx="208" cy="184" rx="19" ry="22" fill="#3B2430"/>
  <circle cx="215" cy="176" r="7" fill="#FFFFFF"/>
  <ellipse cx="304" cy="184" rx="19" ry="22" fill="#3B2430"/>
  <circle cx="311" cy="176" r="7" fill="#FFFFFF"/>

  <!-- 鼻子 -->
  <ellipse cx="256" cy="242" rx="58" ry="42" fill="#FF9DB6" stroke="#D4708C" stroke-width="9"/>
  <ellipse cx="238" cy="242" rx="9" ry="13" fill="#B85C77"/>
  <ellipse cx="274" cy="242" rx="9" ry="13" fill="#B85C77"/>

  <!-- 腮红 -->
  <ellipse cx="146" cy="226" rx="24" ry="16" fill="#FF8FB0" opacity="0.5"/>
  <ellipse cx="366" cy="226" rx="24" ry="16" fill="#FF8FB0" opacity="0.5"/>

  <!-- 卷尾巴画在 512 缩略尺寸下总像一个小钩子/挂件，反而扣分 → 省略，识别靠猪鼻+腮红+耳朵已经足够 -->
</svg>