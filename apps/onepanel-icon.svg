<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="opBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17b3a3" />
      <stop offset="1" stop-color="#0a6b62" />
    </linearGradient>
    <radialGradient id="opGlow" cx="0.5" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 底座满画布，不留边距 -->
  <rect width="512" height="512" rx="112" fill="url(#opBg)" />
  <rect width="512" height="512" rx="112" fill="url(#opGlow)" />
  <circle cx="256" cy="256" r="112" fill="#ffffff" fill-opacity="0.08" />

  <!-- 状态环：轨道 + 70% 进度 -->
  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="52" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="52"
      stroke-linecap="round" stroke-dasharray="703.7 301.6" />
  </g>
</svg>
