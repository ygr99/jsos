<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd7b4"/>
      <stop offset="1" stop-color="#0e7c63"/>
    </linearGradient>
    <linearGradient id="glGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- 满画布底座 -->
  <rect width="512" height="512" rx="112" fill="url(#glBg)"/>
  <!-- 底部同色光晕 -->
  <ellipse cx="256" cy="468" rx="176" ry="44" fill="url(#glGlow)"/>

  <!-- 读数卡 -->
  <rect x="104" y="88" width="304" height="336" rx="32" fill="#ffffff"/>

  <!-- 右侧刻度尺（一览 = 读数 / 量） -->
  <rect x="366" y="150" width="7" height="212" rx="3.5" fill="#eafaf4"/>
  <rect x="358" y="170" width="23" height="8" rx="4" fill="#b8e6d5"/>
  <rect x="358" y="252" width="23" height="8" rx="4" fill="#b8e6d5"/>
  <rect x="358" y="334" width="23" height="8" rx="4" fill="#b8e6d5"/>

  <!-- 三条读数：宽度不同 = 数值不同，颜色从深到浅 -->
  <rect x="140" y="170" width="192" height="44" rx="15" fill="#0e7c63"/>
  <rect x="140" y="252" width="132" height="44" rx="15" fill="#1d9e75"/>
  <rect x="140" y="334" width="164" height="44" rx="15" fill="#5dcaa5"/>
</svg>
